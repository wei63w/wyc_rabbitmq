# 服务端口
server:
  port: 8080

# 数据库配置 druid
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/test?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8
    username: root
    password: test@1234
  # RabbitMQ配置
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: 123456
    virtual-host: /
    # 生产者确认机制
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual # 消费者手动ACK
        prefetch: 1

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mq.demo.entity
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    # mybatis 执行SQL日志设为WARN，屏蔽INFO级SqlSession提示
    org.apache.ibatis.session.defaults.DefaultSqlSession: WARN
    # 可选：关闭完整SQL打印（不想看select/update语句也加上）
    com.mq.demo.mapper: WARN